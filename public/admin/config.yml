backend:
  name: git-gateway
  branch: main

media_folder: "public/uploads"
public_folder: "/uploads"

collections:
  - name: "pages"
    label: "Pages"
    files:
      - file: "src/content/homepage.json"
        label: "Home Page Content"
        name: "homepage"
        fields:
          - { label: "Hero Title", name: "heroTitle", widget: "string"}
          - { label: "Hero Subtitle", name: "heroSubtitle", widget: "text"}
          - { label: "CTA Button Text", name: "ctaText", widget: "string"}
          - { label: "Services Button Text", name: "servicesText", widget: "string"}
          - { label: "Service Name 1", name: "serviceTitle1", widget: "string"}
          - { label: "Service Description 1", name: "serviceDesc1", widget: "text"}
          - { label: "Service Name 2", name: "serviceTitle2", widget: "string"}
          - { label: "Service Description 2", name: "serviceDesc2", widget: "text"}
          - { label: "Service Name 3", name: "serviceTitle3", widget: "string"}
          - { label: "Service Description 3", name: "serviceDesc3", widget: "text"}
          
  - name: "blog"
    label: "Blog"
    folder: "src/content/blog"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Description", name: "description", widget: "string" }
      - { label: "Publish Date", name: "pubDate", widget: "datetime" }
      - { label: "Cover Image", name: "coverImage", widget: "image", required: false}
      - { label: "Author", name: "author", widget: "string", default: "Admin" }
      - { label: "Body", name: "body", widget: "markdown" }
