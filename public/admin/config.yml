backend:
  name: git-gateway
  branch: main

media_folder: "public/images"
public_folder: "/images"

collections:
  - name: "pages"
    label: "Pages"
    files:
      - file: "src/content/homepage.json"
        label: "Home Page Content"
        name: "homepage"
        fields:
          - { label: "Hero Title", name: "heroTitle", widget: "string"}
          - { label: "Hero Subtitle", name: "heroSubtile", widget: "text"}
          - { label: "CTA Button Text", name: "ctaText", widget: "string"}